name: Tests Django du laboratoire

on:
  push:
    branches: [master, experimentation-formulaire]
  pull_request:
    branches: [master]

jobs:
  django-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dockerized_labs/sensitive_data_exposure

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests Django
        run: python manage.py test dataexposure
                    

      - name: Analyser le code avec Bandit
        run: |
          python -m pip install bandit
          python -m bandit -r dataexposure -f json -o bandit_ci.json || true